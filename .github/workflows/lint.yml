name: lint
on: [push, pull_request]

# The job only reads the code. Keep the workflow token read-only.
permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # The runner image ships with PSScriptAnalyzer. Install only if it is missing.
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error -ExcludeRule PSMissingModuleManifestField
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
